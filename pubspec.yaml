name: towards_him_app
description: Toward HIM Flutter mobile application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.3.2
  flutter_tts: ^4.2.5
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/toward_him_logo.svg
    - assets/branding/about_toward_him_header_logo.png
    - assets/icons/
    - assets/icons/home/
    - assets/icons/navigation/
    - assets/images/home/
    - assets/icons/player/
    - assets/images/player/
    - assets/images/weekly/
    - assets/images/community/
    - assets/icons/community/
    - assets/icons/profile/
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf
